[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "targeted-sampler"
version = "0.1.0"
description = "Stratified, reason-bucketed sample collector with pinning, deduplication, and disk-budget rotation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
targeted-sampler = "targeted_sampler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
targeted_sampler = ["py.typed"]
